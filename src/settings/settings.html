<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Better GHSA settings</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <main class="page">
      <h1>Better GHSA</h1>

      <h2>Repositories</h2>

      <form id="add-form" class="add" novalidate>
        <label class="add-label" for="add-input">Add a repository</label>
        <div class="add-controls">
          <input
            id="add-input"
            class="add-input"
            type="text"
            name="repository"
            placeholder="owner/repo"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
          />
          <button id="add-button" class="button button-primary" type="submit">Add</button>
        </div>
        <p id="add-error" class="error" role="alert" hidden></p>
      </form>

      <p id="empty" class="empty" hidden>Add a repository to get started</p>

      <ul id="list" class="list"></ul>

      <div class="clear">
        <button id="clear-button" class="button" type="button">Clear cache</button>
        <p id="clear-status" class="status" role="status" hidden></p>
      </div>

      <div class="diag">
        <label class="diag-label">
          <input id="diag-input" class="diag-input" type="checkbox" />
          <span id="diag-text">Log diagnostics to the browser console</span>
        </label>
      </div>
    </main>

    <script src="../common/storage.js"></script>
    <script src="../common/diag.js"></script>
    <script src="../common/allowlist.js"></script>
    <script src="../common/schema.js"></script>
    <script src="../common/members.js"></script>
    <script src="../common/branches.js"></script>
    <script src="../common/cache.js"></script>
    <script src="../common/forget.js"></script>
    <script src="settings.js"></script>
  </body>
</html>
